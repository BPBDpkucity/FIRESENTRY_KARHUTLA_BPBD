<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — FireSentry Karhutla BPBD Kota Pekanbaru</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark"><img src="assets/img/logo-bpbd.png" alt="Logo BPBD Kota Pekanbaru" class="brand-logo-img"></div>
        <h1>FIRESENTRY KARHUTLA</h1>
        <p>BPBD Kota Pekanbaru — Panel Admin</p>
      </div>

      <div class="login-error" id="login-error">Email atau password salah. Silakan coba lagi.</div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama.akun@bpbdpekanbaru.go.id" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Masuk ke Dashboard</button>
      </form>
      <p style="margin-top:14px;font-size:12px;color:var(--text-400);text-align:center;">
        Belum punya akun? Hubungi Admin Besar BPBD untuk didaftarkan.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const btnLogin = document.getElementById("btn-login");

    // Jika sesi Supabase masih aktif (belum logout), langsung arahkan ke
    // halaman sesuai peran tanpa perlu isi form lagi.
    (async function cekSesiAktif(){
      if(!supabaseClient) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if(!session) return;
      const { data: profil } = await supabaseClient.from("profiles").select("role").eq("id", session.user.id).single();
      if(profil){
        window.location.href = profil.role === "petugas" ? "laporan.html" : "dashboard.html";
      }
    })();

    form.addEventListener("submit", async function(e){
      e.preventDefault();
      errorBox.style.display = "none";

      if(!supabaseClient){
        errorBox.textContent = "Supabase belum dikonfigurasi. Hubungi pengelola sistem (lihat assets/js/supabase-config.js).";
        errorBox.style.display = "block";
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      btnLogin.disabled = true;
      btnLogin.textContent = "Memeriksa…";

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if(error || !data.session){
        errorBox.textContent = "Email atau password salah. Silakan coba lagi.";
        errorBox.style.display = "block";
        btnLogin.disabled = false;
        btnLogin.textContent = "Masuk ke Dashboard";
        return;
      }

      const { data: profil, error: errProfil } = await supabaseClient
        .from("profiles").select("role, aktif").eq("id", data.session.user.id).single();

      if(errProfil || !profil || profil.aktif === false){
        errorBox.textContent = "Akun ini belum terdaftar/dinonaktifkan di sistem. Hubungi Admin Besar BPBD.";
        errorBox.style.display = "block";
        await supabaseClient.auth.signOut();
        btnLogin.disabled = false;
        btnLogin.textContent = "Masuk ke Dashboard";
        return;
      }

      sessionStorage.removeItem("ews_login_tercatat"); // supaya login_log tercatat untuk sesi baru ini
      window.location.href = profil.role === "petugas" ? "laporan.html" : "dashboard.html";
    });
  </script>
</body>
</html>
